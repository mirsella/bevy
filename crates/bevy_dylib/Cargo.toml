[package]
name = "bevy_dylib"
version = "0.19.1"
edition = "2024"
description = "Force the Bevy Engine to be dynamically linked for faster linking"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[lib]
crate-type = ["dylib"]

[features]
zstd_c = ["dep:zstd-sys"]

[dependencies]
zstd-sys = { version = "2.1", git = "https://github.com/mirsella/zstd-rs", rev = "1ccb2e0b9919736293897c4c69bb74758b0a3471", default-features = false, features = ["rust-dylib"], optional = true }
bevy_internal = { path = "../bevy_internal", version = "0.19.1", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
